{% extends "base.html" %}
{% block title %}Forgot Password — NexaBrokers{% endblock %}
{% block content %}
<style>
  :root { --primary:#0a2540; --radius:24px; }
  body { font-family:'Inter',sans-serif; background:#f4f6f9; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
  .card { background:white; border-radius:var(--radius); padding:2.5rem; max-width:400px; width:100%; box-shadow:0 20px 40px rgba(0,0,0,0.05); text-align:center; }
  input { width:100%; padding:0.9rem; border-radius:8px; border:1px solid #e2e6ed; margin:1rem 0; }
  .btn { background:var(--primary); color:white; border:none; padding:0.9rem; border-radius:8px; width:100%; font-weight:600; cursor:pointer; }
</style>
<div class="card">
  <h2 style="color:var(--primary);">Forgot Password</h2>
  <p style="color:#5f6b7a;">Enter your email and we'll send you a reset link.</p>
  <div id="msg" style="display:none;"></div>
  <input type="email" id="resetEmail" placeholder="you@example.com">
  <button class="btn" id="resetBtn">Send Reset Link</button>
  <p style="margin-top:1rem;"><a href="/login-page">Back to login</a></p>
</div>
<script>
document.getElementById("resetBtn").addEventListener("click", async ()=>{
  const email = document.getElementById("resetEmail").value.trim();
  if (!email) return;
  const res = await fetch("/forgot-password", {
    method:"POST",
    headers:{"Content-Type":"application/json","X-CSRFToken":getCSRFToken()},
    body:JSON.stringify({email})
  });
  const data = await res.json();
  const msg = document.getElementById("msg"); msg.style.display="block";
  msg.textContent = data.message; msg.style.color = "#0f7b4e";
});
</script>
{% endblock %}
