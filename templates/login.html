{% extends "base.html" %}
{% block title %}Sign In — NexaBrokers{% endblock %}
{% block content %}
<style>
  :root {
    --primary: #0a2540;
    --primary-light: #1e3a5f;
    --accent: #d4a853;
    --gray-100: #f4f6f9;
    --gray-200: #e2e6ed;
    --gray-600: #5f6b7a;
    --gray-800: #1a1f36;
    --danger: #c0392b;
    --success: #0f7b4e;
    --radius-card: 20px;
    --radius-input: 10px;
    --font: 'Inter', system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    background: #0a2540; /* fallback */
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  /* Full‑screen background image */
  .bg-image {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background: url('https://images.unsplash.com/photo-1600880292203-757bb62b4baf?w=1500&auto=format&fit=crop') center/cover no-repeat;
    z-index: 0;
  }
  /* Dark overlay for text readability */
  .overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, rgba(10,37,64,0.82) 0%, rgba(10,37,64,0.4) 100%);
    z-index: 1;
  }
  /* Glass-morphism card – spacious and centered */
  .login-card {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 520px;
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-radius: var(--radius-card);
    box-shadow: 0 35px 70px rgba(0,0,0,0.25);
    padding: 3rem 2.5rem;
    margin: 1.5rem;
    animation: fadeIn 0.6s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .logo {
    font-size: 2.2rem;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--primary);
    margin-bottom: 0.4rem;
  }
  .logo span { color: var(--accent); }
  .subtitle {
    color: var(--gray-600);
    font-size: 1rem;
    margin-bottom: 2.2rem;
    text-align: center;
  }
  .form-group {
    width: 100%;
    margin-bottom: 1.4rem;
  }
  label {
    display: block;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--gray-800);
    margin-bottom: 0.4rem;
  }
  input {
    width: 100%;
    padding: 0.9rem 1.2rem;
    border: 1px solid var(--gray-200);
    border-radius: var(--radius-input);
    font-size: 1rem;
    background: white;
    color: var(--gray-800);
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
  }
  input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(10,37,64,0.12);
  }
  .btn-primary {
    width: 100%;
    padding: 0.95rem;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: var(--radius-input);
    font-weight: 600;
    font-size: 1.1rem;
    letter-spacing: 0.3px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    margin-top: 0.6rem;
  }
  .btn-primary:hover { background: var(--primary-light); }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:disabled { opacity: 0.65; cursor: not-allowed; }
  .alert {
    width: 100%;
    padding: 0.85rem 1rem;
    border-radius: 10px;
    font-size: 0.95rem;
    margin-bottom: 1.5rem;
    text-align: center;
    font-weight: 500;
  }
  .alert-success {
    background: #e6f7ed;
    color: var(--success);
    border: 1px solid #b8e6d0;
  }
  .alert-danger {
    background: #fdecea;
    color: var(--danger);
    border: 1px solid #f5c6cb;
  }
  .footer-text {
    margin-top: 2rem;
    font-size: 0.95rem;
    color: var(--gray-600);
    text-align: center;
  }
  .footer-text a {
    color: var(--primary);
    font-weight: 600;
    text-decoration: none;
  }
  .footer-text a:hover { text-decoration: underline; }

  /* On small screens, reduce padding slightly */
  @media (max-width: 500px) {
    .login-card {
      padding: 2.5rem 1.5rem;
      margin: 0.8rem;
    }
  }
</style>

<div class="bg-image" aria-hidden="true"></div>
<div class="overlay" aria-hidden="true"></div>

<div class="login-card">
  <div class="logo">Nexa<span>Brokers</span></div>
  <div class="subtitle">Sign in to your trading dashboard</div>

  <div id="message" class="alert" style="display: none;"></div>

  <form id="loginForm" style="width:100%;">
    <div class="form-group">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" placeholder="you@example.com" maxlength="255" autocomplete="email" required>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="Your password" minlength="8" autocomplete="current-password" required>
    </div>

    <button type="submit" class="btn-primary" id="loginButton">Sign In</button>
  </form>

  <div class="footer-text">
    Don't have an account? <a href="/signup-page">Create one</a>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const loginButton = document.getElementById("loginButton");

form.addEventListener("submit", async function(e) {
  e.preventDefault();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  message.style.display = "none";
  loginButton.disabled = true;
  loginButton.textContent = "Signing in...";

  try {
    const response = await fetch("/login-request", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Login failed.");

    let successMsg = data.message || "Verification code generated.";
    if (data.development_code) {
      successMsg += " Your verification code: " + data.development_code;
    }
    message.textContent = successMsg;
    message.className = "alert alert-success";
    message.style.display = "block";

    sessionStorage.setItem("verificationEmail", email);
    const redirectDelay = data.development_code ? 15000 : 1200;
    setTimeout(() => { window.location.href = "/verify-page"; }, redirectDelay);
  } catch (error) {
    message.textContent = error.message;
    message.className = "alert alert-danger";
    message.style.display = "block";
    loginButton.disabled = false;
    loginButton.textContent = "Sign In";
  }
});
</script>
{% endblock %}
