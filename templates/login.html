{% extends "base.html" %}

{% block title %}Sign In | NexaBrokers{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h1>Sign In</h1>

        <p class="auth-subtitle">
            Welcome back to NexaBrokers.
        </p>

        <form method="POST" action="{{ url_for('login_request') }}">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="you@example.com"
                required
                autocomplete="email"
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
                autocomplete="current-password"
            >

            <button
                type="submit"
                class="primary-btn"
            >
                Sign In
            </button>

        </form>

        <p class="auth-footer">
            Don't have an account?
            <a href="{{ url_for('signup_page') }}">
                Create an Account
            </a>
        </p>

    </div>

</div>

{% endblock %}
