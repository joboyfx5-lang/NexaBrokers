{% extends "base.html" %}
{% block title %}Sign In — NexaBrokers{% endblock %}
{% block content %}
<style>
  :root {
    --primary: #0a2540;
    --primary-light: #1e3a5f;
    --accent: #d4a853;
    --gray-100: #f4f6f9;
    --gray-200: #e2e6ed;
    --gray-600: #5f6b7a;
    --gray-800: #1a1f36;
    --danger: #c0392b;
    --success: #0f7b4e;
    --radius: 16px;
    --shadow: 0 25px 50px -12px rgba(0,0,0,0.15);
    --font: 'Inter', system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    background: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .split-container {
    display: flex;
    width: 100%;
    max-width: 1100px;
    min-height: 650px;
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    background: white;
    margin: 1rem;
  }
  .image-side {
    flex: 1;
    background: url('https://images.unsplash.com/photo-1600880292203-757bb62b4baf?w=800&auto=format&fit=crop') center/cover no-repeat;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 2.5rem;
    color: white;
    min-height: 300px;
  }
  .image-side::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(0deg, rgba(10,37,64,0.85) 0%, rgba(10,37,64,0.25) 100%);
  }
  .image-side-content {
    position: relative;
    z-index: 1;
  }
  .image-side h2 {
    font-size: 2.2rem;
    font-weight: 700;
    line-height: 1.2;
    margin-bottom: 0.5rem;
  }
  .image-side p {
    font-size: 1rem;
    opacity: 0.9;
    max-width: 300px;
  }
  .form-side {
    flex: 1;
    padding: 2.5rem 2.5rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
    background: white;
  }
  .logo {
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--primary);
    margin-bottom: 0.2rem;
  }
  .logo span { color: var(--accent); }
  .subtitle {
    color: var(--gray-600);
    font-size: 0.95rem;
    margin-bottom: 2rem;
  }
  .form-group {
    margin-bottom: 1.2rem;
  }
  label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--gray-800);
    margin-bottom: 0.35rem;
  }
  input {
    width: 100%;
    padding: 0.75rem 1rem;
    border: 1px solid var(--gray-200);
    border-radius: 8px;
    font-size: 0.95rem;
    transition: border-color 0.2s, box-shadow 0.2s;
    background: var(--gray-100);
    color: var(--gray-800);
  }
  input:focus {
    outline: none;
    border-color: var(--primary-light);
    box-shadow: 0 0 0 3px rgba(10,37,64,0.1);
    background: white;
  }
  .btn-primary {
    width: 100%;
    padding: 0.85rem;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    font-size: 1rem;
    letter-spacing: 0.3px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    margin-top: 0.5rem;
  }
  .btn-primary:hover { background: var(--primary-light); }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
  .alert {
    padding: 0.75rem 1rem;
    border-radius: 8px;
    font-size: 0.9rem;
    margin-bottom: 1.25rem;
    text-align: center;
    font-weight: 500;
  }
  .alert-success {
    background: #e6f7ed;
    color: var(--success);
    border: 1px solid #b8e6d0;
  }
  .alert-danger {
    background: #fdecea;
    color: var(--danger);
    border: 1px solid #f5c6cb;
  }
  .footer-text {
    text-align: center;
    margin-top: 1.5rem;
    font-size: 0.9rem;
    color: var(--gray-600);
  }
  .footer-text a {
    color: var(--primary);
    font-weight: 600;
    text-decoration: none;
  }
  .footer-text a:hover { text-decoration: underline; }

  @media (max-width: 768px) {
    .split-container {
      flex-direction: column;
      min-height: auto;
      margin: 0;
      border-radius: 0;
      box-shadow: none;
    }
    .image-side {
      min-height: 220px;
      padding: 2rem;
    }
    .image-side h2 { font-size: 1.6rem; }
    .form-side { padding: 2rem 1.5rem; }
  }
</style>

<div class="split-container">
  <div class="image-side">
    <div class="image-side-content">
      <h2>Welcome back</h2>
      <p>Access your trading dashboard securely.</p>
    </div>
  </div>
  <div class="form-side">
    <div class="logo">Nexa<span>Brokers</span></div>
    <div class="subtitle">Sign in to your account</div>

    <div id="message" class="alert" style="display: none;"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" maxlength="255" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Your password" minlength="8" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-primary" id="loginButton">Sign In</button>
    </form>
    <div class="footer-text">
      Don't have an account? <a href="/signup-page">Create one</a>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const loginButton = document.getElementById("loginButton");

form.addEventListener("submit", async function(e) {
  e.preventDefault();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  message.style.display = "none";
  loginButton.disabled = true;
  loginButton.textContent = "Signing in...";

  try {
    const response = await fetch("/login-request", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Login failed.");

    let successMsg = data.message || "Verification code generated.";
    if (data.development_code) {
      successMsg += " Your verification code: " + data.development_code;
    }
    message.textContent = successMsg;
    message.className = "alert alert-success";
    message.style.display = "block";

    sessionStorage.setItem("verificationEmail", email);
    const redirectDelay = data.development_code ? 15000 : 1200;
    setTimeout(() => { window.location.href = "/verify-page"; }, redirectDelay);
  } catch (error) {
    message.textContent = error.message;
    message.className = "alert alert-danger";
    message.style.display = "block";
    loginButton.disabled = false;
    loginButton.textContent = "Sign In";
  }
});
</script>
{% endblock %}
