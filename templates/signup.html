{% extends "base.html" %}

{% block title %}Create Account — NexaBrokers{% endblock %}

{% block content %}
<style>
  :root {
    --primary: #0f3b3b;
    --primary-light: #1a5c5c;
    --accent: #d4a853;
    --gray-100: #f7f9fc;
    --gray-200: #e9edf4;
    --gray-600: #5e6c84;
    --gray-800: #1a2332;
    --danger: #c0392b;
    --success: #1e7a5e;
    --radius: 12px;
    --shadow: 0 20px 40px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.04);
    --font: 'Inter', system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .auth-card {
    background: white;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    width: 100%;
    max-width: 450px;
    padding: 2.5rem 2rem;
    animation: fadeSlide 0.5s ease;
  }
  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .logo {
    font-size: 1.75rem;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--primary);
    margin-bottom: 0.25rem;
  }
  .logo span { color: var(--accent); }
  .subtitle {
    color: var(--gray-600);
    font-size: 0.95rem;
    margin-bottom: 2rem;
  }
  .form-group {
    margin-bottom: 1.25rem;
  }
  label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--gray-800);
    margin-bottom: 0.35rem;
  }
  input {
    width: 100%;
    padding: 0.75rem 1rem;
    border: 1px solid var(--gray-200);
    border-radius: 8px;
    font-size: 0.95rem;
    transition: border-color 0.2s, box-shadow 0.2s;
    background: var(--gray-100);
    color: var(--gray-800);
  }
  input:focus {
    outline: none;
    border-color: var(--primary-light);
    box-shadow: 0 0 0 3px rgba(15, 59, 59, 0.1);
    background: white;
  }
  .btn-primary {
    width: 100%;
    padding: 0.85rem;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    font-size: 1rem;
    letter-spacing: 0.3px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    margin-top: 0.5rem;
  }
  .btn-primary:hover { background: var(--primary-light); }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:disabled {
    opacity: 0.7;
    cursor: not-allowed;
  }
  .alert {
    padding: 0.75rem 1rem;
    border-radius: 8px;
    font-size: 0.9rem;
    margin-bottom: 1.25rem;
    text-align: center;
    font-weight: 500;
  }
  .alert-success {
    background: #e6f7ed;
    color: var(--success);
    border: 1px solid #b8e6d0;
  }
  .alert-danger {
    background: #fdecea;
    color: var(--danger);
    border: 1px solid #f5c6cb;
  }
  .footer-text {
    text-align: center;
    margin-top: 1.5rem;
    font-size: 0.9rem;
    color: var(--gray-600);
  }
  .footer-text a {
    color: var(--primary);
    font-weight: 600;
    text-decoration: none;
  }
  .footer-text a:hover { text-decoration: underline; }
</style>

<div class="auth-card">
  <div class="logo">Nexa<span>Brokers</span></div>
  <div class="subtitle">Create your secure broker account</div>

  <div id="message" class="alert" style="display: none;"></div>

  <form id="signupForm">
    <div class="form-group">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" placeholder="Choose a username" minlength="3" maxlength="80" autocomplete="username" required>
    </div>

    <div class="form-group">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" placeholder="you@example.com" maxlength="255" autocomplete="email" required>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="At least 8 characters" minlength="8" autocomplete="new-password" required>
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirm password</label>
      <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Enter password again" minlength="8" autocomplete="new-password" required>
    </div>

    <button type="submit" class="btn-primary" id="submitButton">Create Account</button>
  </form>

  <div class="footer-text">
    Already have an account? <a href="/login-page">Sign in</a>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const form = document.getElementById("signupForm");
const message = document.getElementById("message");
const submitButton = document.getElementById("submitButton");

form.addEventListener("submit", async function(e) {
  e.preventDefault();
  const username = document.getElementById("username").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  message.style.display = "none";

  if (password !== confirmPassword) {
    message.textContent = "Passwords do not match.";
    message.className = "alert alert-danger";
    message.style.display = "block";
    return;
  }
  if (password.length < 8) {
    message.textContent = "Password must contain at least 8 characters.";
    message.className = "alert alert-danger";
    message.style.display = "block";
    return;
  }

  submitButton.disabled = true;
  submitButton.textContent = "Creating account...";

  try {
    const response = await fetch("/signup", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, email, password })
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Unable to create account.");

    let successMsg = data.message || "Account created successfully.";
    if (data.development_code) {
      successMsg += " Your verification code: " + data.development_code;
    }
    message.textContent = successMsg;
    message.className = "alert alert-success";
    message.style.display = "block";

    sessionStorage.setItem("verificationEmail", email);

    const redirectDelay = data.development_code ? 15000 : 1200;
    setTimeout(() => { window.location.href = "/verify-page"; }, redirectDelay);

  } catch (error) {
    message.textContent = error.message;
    message.className = "alert alert-danger";
    message.style.display = "block";
    submitButton.disabled = false;
    submitButton.textContent = "Create Account";
  }
});
</script>
{% endblock %}
