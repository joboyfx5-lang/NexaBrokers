{% extends "base.html" %}

{% block title %}
Create Account — NexaBrokers
{% endblock %}

{% block content %}

<section class="section">

    <div class="form-wrapper">

        <div class="card">

            <div class="badge">
                NexaBrokers
            </div>

            <h1>
                Create your account
            </h1>

            <p class="form-subtitle">
                Create a secure account to access your
                NexaBrokers dashboard.
            </p>


            <div
                id="message"
                class="alert"
                style="display: none;"
            ></div>


            <form id="signupForm">

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        id="username"
                        name="username"
                        type="text"
                        placeholder="Choose a username"
                        minlength="3"
                        maxlength="80"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email address
                    </label>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        placeholder="you@example.com"
                        maxlength="255"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        placeholder="At least 8 characters"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm password
                    </label>

                    <input
                        id="confirmPassword"
                        name="confirmPassword"
                        type="password"
                        placeholder="Enter your password again"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-primary form-submit"
                    id="submitButton"
                >
                    Create Account
                </button>

            </form>


            <p
                style="
                    text-align: center;
                    margin-top: 22px;
                    color: var(--muted);
                "
            >
                Already have an account?

                <a
                    href="/login-page"
                    style="color: var(--primary); font-weight: 700;"
                >
                    Sign in
                </a>
            </p>

        </div>

    </div>

</section>

{% endblock %}


{% block scripts %}

<script>

const form = document.getElementById("signupForm");
const message = document.getElementById("message");
const submitButton = document.getElementById("submitButton");

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const username =
        document.getElementById("username").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;


    message.style.display = "none";


    if (password !== confirmPassword) {

        message.textContent =
            "Passwords do not match.";

        message.className =
            "alert alert-danger";

        message.style.display =
            "block";

        return;
    }


    if (password.length < 8) {

        message.textContent =
            "Password must contain at least 8 characters.";

        message.className =
            "alert alert-danger";

        message.style.display =
            "block";

        return;
    }


    submitButton.disabled = true;

    submitButton.textContent =
        "Creating account...";


    try {

        const response = await fetch(
            "/signup",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    username: username,
                    email: email,
                    password: password
                })
            }
        );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Unable to create account."
            );
        }


        // Build success message – include dev code if present
        let successMsg =
            data.message ||
            "Account created successfully.";

        if (data.development_code) {
            successMsg +=
                " Your verification code: " +
                data.development_code;
        }

        message.textContent = successMsg;

        message.className =
            "alert alert-success";

        message.style.display =
            "block";


        /*
         * Store the email temporarily so the
         * verification page knows which account
         * is being verified.
         */

        sessionStorage.setItem(
            "verificationEmail",
            email
        );


        // Delay redirect: long enough to copy the code
        const redirectDelay =
            data.development_code
                ? 15000   // 15 seconds when dev code is shown
                : 1200;   // normal fast redirect

        setTimeout(function() {

            window.location.href =
                "/verify-page";

        }, redirectDelay);


    } catch (error) {

        message.textContent =
            error.message;

        message.className =
            "alert alert-danger";

        message.style.display =
            "block";


        submitButton.disabled =
            false;

        submitButton.textContent =
            "Create Account";
    }

});

</script>

{% endblock %}
