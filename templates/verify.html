{% extends "base.html" %}
{% block title %}Verify — NexaBrokers{% endblock %}
{% block content %}
<style>
  :root {
    --primary: #0a2540;
    --primary-light: #1e3a5f;
    --accent: #d4a853;
    --gray-100: #f4f6f9;
    --gray-200: #e2e6ed;
    --gray-600: #5f6b7a;
    --gray-800: #1a1f36;
    --danger: #c0392b;
    --success: #0f7b4e;
    --radius: 16px;
    --shadow: 0 25px 50px -12px rgba(0,0,0,0.15);
    --font: 'Inter', system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    background: linear-gradient(135deg, #f4f6f9 0%, #e9edf2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .verify-card {
    background: white;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    width: 100%;
    max-width: 440px;
    padding: 2.5rem 2rem;
    text-align: center;
    animation: fadeSlide 0.4s ease;
  }
  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .logo {
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 0.25rem;
  }
  .logo span { color: var(--accent); }
  .subtitle {
    color: var(--gray-600);
    font-size: 0.95rem;
    margin-bottom: 1.8rem;
  }
  .email-badge {
    background: var(--gray-100);
    border-radius: 40px;
    padding: 0.5rem 1.5rem;
    display: inline-block;
    font-weight: 500;
    color: var(--gray-800);
    margin-bottom: 2rem;
    font-size: 0.95rem;
  }
  .form-group {
    margin-bottom: 1.5rem;
    text-align: left;
  }
  label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--gray-800);
    margin-bottom: 0.35rem;
  }
  input {
    width: 100%;
    padding: 0.75rem 1rem;
    border: 1px solid var(--gray-200);
    border-radius: 8px;
    font-size: 1.2rem;
    letter-spacing: 3px;
    text-align: center;
    transition: border-color 0.2s, box-shadow 0.2s;
    background: var(--gray-100);
    color: var(--gray-800);
  }
  input:focus {
    outline: none;
    border-color: var(--primary-light);
    box-shadow: 0 0 0 3px rgba(10,37,64,0.1);
    background: white;
  }
  .btn-primary {
    width: 100%;
    padding: 0.85rem;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    font-size: 1rem;
    letter-spacing: 0.3px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-primary:hover { background: var(--primary-light); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
  .alert {
    padding: 0.75rem 1rem;
    border-radius: 8px;
    font-size: 0.9rem;
    margin-bottom: 1.25rem;
    font-weight: 500;
  }
  .alert-success {
    background: #e6f7ed;
    color: var(--success);
    border: 1px solid #b8e6d0;
  }
  .alert-danger {
    background: #fdecea;
    color: var(--danger);
    border: 1px solid #f5c6cb;
  }
  .footer-text {
    margin-top: 1.8rem;
    font-size: 0.9rem;
    color: var(--gray-600);
  }
  .footer-text a {
    color: var(--primary);
    font-weight: 600;
    text-decoration: none;
  }
  .footer-text a:hover { text-decoration: underline; }
</style>

<div class="verify-card">
  <div class="logo">Nexa<span>Brokers</span></div>
  <div class="subtitle">Secure your account</div>
  <div class="email-badge" id="emailDisplay">Loading email...</div>

  <div id="message" class="alert" style="display: none;"></div>

  <form id="verifyForm">
    <div class="form-group">
      <label for="code">Verification code</label>
      <input id="code" name="code" type="text" inputmode="numeric" pattern="\d{6}" maxlength="6" placeholder="000000" required autofocus>
    </div>
    <button type="submit" class="btn-primary" id="verifyButton">Verify &amp; Login</button>
  </form>

  <div class="footer-text">
    Didn't receive it? <a href="/login-page">Back to login</a>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const email = sessionStorage.getItem("verificationEmail");
document.getElementById("emailDisplay").textContent = email || "unknown@email.com";

const form = document.getElementById("verifyForm");
const message = document.getElementById("message");
const verifyButton = document.getElementById("verifyButton");

form.addEventListener("submit", async function(e) {
  e.preventDefault();
  const code = document.getElementById("code").value.trim();

  if (!email) {
    message.textContent = "No email found. Please sign up or login again.";
    message.className = "alert alert-danger";
    message.style.display = "block";
    return;
  }

  message.style.display = "none";
  verifyButton.disabled = true;
  verifyButton.textContent = "Verifying...";

  try {
    const response = await fetch("/verify-code", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, code })
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Verification failed.");

    message.textContent = data.message || "Verified!";
    message.className = "alert alert-success";
    message.style.display = "block";

    sessionStorage.removeItem("verificationEmail");
    setTimeout(() => { window.location.href = "/dashboard-page"; }, 800);
  } catch (error) {
    message.textContent = error.message;
    message.className = "alert alert-danger";
    message.style.display = "block";
    verifyButton.disabled = false;
    verifyButton.textContent = "Verify & Login";
  }
});
</script>
{% endblock %}
