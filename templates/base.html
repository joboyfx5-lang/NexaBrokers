<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="NexaBrokers — secure account and transaction management platform."
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

    <title>
        {% block title %}NexaBrokers{% endblock %}
    </title>
</head>

<body>

    <!-- ================================
         NAVIGATION
         ================================ -->

    <nav class="navbar">

        <div class="nav-container">

            <a href="/" class="logo">
                Nexa<span>Brokers</span>
            </a>

            <div class="nav-links">

                <a href="/">
                    Home
                </a>

                {% if session.get("user_id") %}

                    <a href="/dashboard-page">
                        Dashboard
                    </a>

                    <a href="/logout">
                        Logout
                    </a>

                {% else %}

                    <a href="/login-page">
                        Login
                    </a>

                    <a
                        href="/signup-page"
                        class="btn btn-primary"
                    >
                        Get Started
                    </a>

                {% endif %}

            </div>

        </div>

    </nav>


    <!-- ================================
         MAIN CONTENT
         ================================ -->

    <main>

        {% block content %}

        {% endblock %}

    </main>


    <!-- ================================
         FOOTER
         ================================ -->

    <footer class="footer">

        <div class="container">

            <p>
                © 2026 NexaBrokers. All rights reserved.
            </p>

            <p>
                Secure account and transaction management platform.
            </p>

        </div>

    </footer>


    <!-- ================================
         JAVASCRIPT
         ================================ -->

    {% block scripts %}

    {% endblock %}

</body>
</html>
